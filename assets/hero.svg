<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Friessein</title>
  <desc id="description">A dark gradient profile banner with orange and violet accents.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B16" />
      <stop offset="0.55" stop-color="#11162A" />
      <stop offset="1" stop-color="#1D1238" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FB923C" />
      <stop offset="0.5" stop-color="#F97316" />
      <stop offset="1" stop-color="#A78BFA" />
    </linearGradient>
    <radialGradient id="glowOrange">
      <stop offset="0" stop-color="#F97316" stop-opacity="0.38" />
      <stop offset="1" stop-color="#F97316" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowViolet">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.34" />
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)" />
  <rect width="1200" height="360" rx="28" fill="url(#grid)" />
  <circle cx="160" cy="44" r="260" fill="url(#glowOrange)" />
  <circle cx="1080" cy="330" r="310" fill="url(#glowViolet)" />

  <g opacity="0.76">
    <path d="M70 270C240 218 322 321 481 262S760 172 913 225s210 20 252-3" fill="none" stroke="url(#accent)" stroke-width="2" />
    <path d="M75 292C231 246 332 337 485 282s274-91 421-42 205 17 256-1" fill="none" stroke="#FFFFFF" stroke-opacity="0.11" />
  </g>

  <g transform="translate(98 78)" filter="url(#shadow)">
    <rect width="48" height="48" rx="14" fill="url(#accent)" />
    <path d="M15 14h20v6H21v6h12v6H21v9h-6z" fill="#FFFFFF" />
  </g>

  <text x="98" y="200" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="750" letter-spacing="1">FRIESSEIN</text>
  <rect x="99" y="221" width="218" height="5" rx="2.5" fill="url(#accent)" />
  <text x="98" y="270" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="500" letter-spacing="5">DEVELOPER  ·  CREATOR  ·  LEARNER</text>

  <g transform="translate(965 84)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect width="136" height="136" rx="34" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.12" />
    <path d="M45 54 27 68l18 14M91 54l18 14-18 14M77 40 59 96" stroke="url(#accent)" stroke-width="8" />
  </g>

  <circle cx="1120" cy="45" r="5" fill="#FB923C" />
  <circle cx="1144" cy="45" r="5" fill="#A78BFA" />
  <circle cx="1096" cy="45" r="5" fill="#FFFFFF" fill-opacity="0.38" />
</svg>
